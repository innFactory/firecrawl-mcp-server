# innFactory-only workflow (lives on the innfactory-image-build branch, NOT on
# main, so the upstream fork-sync never conflicts). Builds the self-host image
# companyGPT deploys (modules/websearch/firecrawl-mcp.tf) from this branch and
# pushes it to ghcr.io/innfactory/firecrawl-mcp-server:<tag>.
#
# The branch carries the innFactory changes on top of an upstream release
# (v3.24.0-inn.1: FIRECRAWL_MCP_TOOLS allowlist). Dockerfile.service pins the
# Node patch level (Node.js Security Release 2026-10-21: 22.23.4).
#
# Trigger: push to this branch builds DEFAULT_TAG. After the first run:
#   gh workflow run innfactory-release-image.yml -R innFactory/firecrawl-mcp-server \
#     --ref innfactory-image-build -f tag=v3.24.0-inn.3
name: innFactory Release Image

on:
  push:
    branches:
      - innfactory-image-build
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v3.24.0-inn.2)"
        required: true
        type: string

env:
  DEFAULT_TAG: v3.24.0-inn.2

permissions:
  contents: read
  packages: write

concurrency:
  group: innfactory-release-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || env.DEFAULT_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AKS node pools are linux/amd64 only — no multi-arch needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.service
          push: true
          platforms: linux/amd64
          tags: ghcr.io/innfactory/firecrawl-mcp-server:${{ steps.tag.outputs.tag }}
